name: CI

# Runs on pull requests and again on main once they merge, so every commit
# on main shows its own result.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request cancels the run it replaces. Runs on
# main are grouped by commit, so a later merge never cancels (or replaces
# the queued run of) an earlier one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # Warnings fail the build with gcc and clang. MSVC is left out: its
      # /W4 warnings can't be checked locally, so /WX stays off until a
      # Windows run is known to be clean.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.os != 'windows-latest' && '-DNLU_SCRIPT_WARNINGS_AS_ERRORS=ON' || '' }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # Fuzzes the script compiler, the matcher and loading saved scripts for a
  # minute each, with AddressSanitizer and UndefinedBehaviorSanitizer. The
  # demo script, the sentences in its test files and the saved demo seed the
  # corpora. Crashing inputs are uploaded.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DNLU_SCRIPT_BUILD_TESTS=OFF -DNLU_SCRIPT_BUILD_FUZZERS=ON
          -DNLU_SCRIPT_WARNINGS_AS_ERRORS=ON
          "-DCMAKE_CXX_FLAGS=-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=undefined"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-fuzz --parallel --target fuzz_script fuzz_match fuzz_load nlu_script_cli
      - name: Seed corpora
        run: |
          mkdir -p corpus/script corpus/match corpus/load crashes
          cp examples/demo.nlu corpus/script/
          awk 'NF && !/^#/ && !/^ /' examples/demo.test examples/personas/*.test \
            | split -l 1 -a 3 - corpus/match/line-
          ./build-fuzz/nlu_script_cli --save examples/demo.nlu corpus/load/demo.nlub
      - name: Fuzz the matcher
        run: >
          ./build-fuzz/fuzz_match -max_total_time=60 -timeout=10 -rss_limit_mb=2560
          -artifact_prefix=crashes/ corpus/match
      - name: Fuzz scripts
        run: >
          ./build-fuzz/fuzz_script -max_total_time=60 -timeout=10 -rss_limit_mb=2560
          -artifact_prefix=crashes/ corpus/script
      - name: Fuzz loading saved scripts
        run: >
          ./build-fuzz/fuzz_load -max_total_time=60 -timeout=10 -rss_limit_mb=2560
          -artifact_prefix=crashes/ corpus/load
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: crashes/
          retention-days: 7

  # The tests under ThreadSanitizer, which checks the hand-written
  # reader-writer lock and the cache that renumbers states on eviction. The
  # Python test is left out in both sanitizer jobs: it loads the library
  # through ctypes into an interpreter that isn't built with the sanitizer.
  thread-sanitizer:
    name: thread sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DNLU_SCRIPT_WARNINGS_AS_ERRORS=ON
          "-DCMAKE_CXX_FLAGS=-fsanitize=thread -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread"
          "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread"
      - name: Build
        run: cmake --build build-tsan --parallel
      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure -E nlu_script_python_tests

  # The tests under AddressSanitizer and UndefinedBehaviorSanitizer; undefined
  # behavior fails the test instead of printing a warning.
  address-sanitizer:
    name: address and undefined sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DNLU_SCRIPT_WARNINGS_AS_ERRORS=ON
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
          "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure -E nlu_script_python_tests

  # The one check to mark as required for merging into main, so the branch
  # rule doesn't have to list (and track) every matrix job. It runs even when
  # a job it needs fails, because a skipped required check counts as passing.
  ci-passed:
    name: CI passed
    if: always()
    needs: [build-and-test, fuzz, thread-sanitizer, address-sanitizer]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI jobs succeeded"
