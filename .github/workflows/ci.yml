name: CI

# Runs on pull requests only: the merge into main is the commit a pull
# request already tested, so re-running on push to main would double the
# Actions minutes this private repository uses.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # The one check to mark as required for merging into main, so the branch
  # rule doesn't have to list (and track) every matrix job. It runs even when
  # a job it needs fails, because a skipped required check counts as passing.
  ci-passed:
    name: CI passed
    if: always()
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All CI jobs succeeded"
