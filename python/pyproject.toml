[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
# The wheels are py3-none-<platform>: cibuildwheel builds one per platform and
# tests it on every supported CPython.
archs = ["auto64"]
test-command = "python -m unittest discover -s {project}/python/tests -t {project}/python/tests"
